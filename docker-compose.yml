services:
  web:
    build: .
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    # El resolver DNS intern del bridge de Docker (127.0.0.11) falla de
    # manera intermitent (SERVFAIL) en aquest entorn. Amb la xarxa del
    # host, el contenidor usa directament el DNS de l'amfitrió, que
    # funciona. Només disponible a Linux; ports: no cal (el contenidor
    # ja escolta directament als ports del host).
    network_mode: host
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      # Necessari perquè Vite detecti canvis de fitxers de manera fiable
      # dins d'algunes configuracions de bind mount de Docker.
      - CHOKIDAR_USEPOLLING=true
      # El DNS d'aquest entorn falla intermitentment (EAI_AGAIN) quan npm
      # llança moltes peticions IPv6 en paral·lel; es força IPv4 i es
      # limiten les connexions simultànies per evitar-ho.
      - NODE_OPTIONS=--dns-result-order=ipv4first

volumes:
  node_modules:
